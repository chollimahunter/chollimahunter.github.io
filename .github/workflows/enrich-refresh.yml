name: Enrichment refresh

# Weekly re-run of the status enrichers whose answers go stale: whether
# accounts still exist, whether malware is still online, and what OSV says
# about each indexed package. The data workflows enrich only what they add,
# and nothing else re-checks a record once it has an answer. Never commits to
# main: each run updates one standing pull request. See docs/enrich-refresh.md.
#
# Two jobs, as in gh-analyzer.yml. `enrich` runs the scripts with a read-only
# token and no stored git credentials and hands the data files on as an
# artifact. `propose` holds the write permissions and opens the pull request.

on:
  schedule:
    - cron: "20 5 * * 0" # Sunday 05:20 UTC
  workflow_dispatch:

permissions:
  contents: read

# One-line toggle for opt-in auto-merge (see docs/ci.md): "true" merges this
# workflow's pull request once its dispatched ci run is green; "false" leaves
# every pull request for manual review.
env:
  AUTO_MERGE: "true"

concurrency:
  group: enrich-refresh
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # Each enricher carries continue-on-error: one lookup service being down
      # must not discard what the others learned. A failed enricher leaves its
      # data file as checked in.
      - name: Platform accounts
        shell: bash
        run: node scripts/enrich-platform-accounts.js
        continue-on-error: true

      - name: GitHub accounts
        shell: bash
        run: node scripts/enrich-github-accounts.js
        continue-on-error: true

      - name: Malware status
        shell: bash
        run: node scripts/enrich-malware-status.js
        continue-on-error: true

      - name: OSV malicious-package advisories
        shell: bash
        run: node scripts/enrich-osv-malicious.js
        continue-on-error: true

      - name: Stage results for the pull request
        run: |
          mkdir proposal
          cp scripts/data/platform-account-status.json \
            scripts/data/github-account-status.json \
            scripts/data/malware-status.json \
            scripts/data/osv-malicious.json \
            proposal/

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enrich-refresh-proposal
          path: proposal/
          retention-days: 1
          if-no-files-found: error

  propose:
    needs: enrich
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      merge-reason: ${{ steps.merge.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: enrich-refresh-proposal
          path: proposal

      - name: Put results in place
        run: cp proposal/*.json scripts/data/

      - name: Open or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: refresh enrichment status data"
          title: "Weekly refresh: enrichment status data"
          body: |
            Weekly re-check of whether indexed accounts still exist, whether
            malicious repositories and packages are still online, and what OSV
            publishes about each package (see `docs/enrich-refresh.md`).

            A status is an observation on the day it was checked, not a finding
            about anyone. Review the diff in `scripts/data/` before merging.

            Validation runs as a dispatched `ci` check on this branch; the pull
            request can be merged once it is green.
          branch: enrich/refresh
          add-paths: |
            scripts/data/platform-account-status.json
            scripts/data/github-account-status.json
            scripts/data/malware-status.json
            scripts/data/osv-malicious.json
          labels: automated,data-sync

      # Pull requests opened with GITHUB_TOKEN trigger no pull_request runs, so
      # the validation workflow is dispatched on the branch instead.
      - name: Validate the pull request branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      # The scheduled run opens a pull request with GITHUB_TOKEN, which triggers
      # no push run when merged, so the action also dispatches deploy.yml.
      - name: Return to the base commit
        if: env.AUTO_MERGE == 'true' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        run: git checkout --quiet "$GITHUB_SHA"

      - name: Merge when ci is green
        id: merge
        if: env.AUTO_MERGE == 'true' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        uses: ./.github/actions/merge-when-green
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          branch: ${{ steps.cpr.outputs.pull-request-branch }}
          expected-branch: enrich/refresh

  # Nothing here reports a failed enrichment run; this job reports only a ci
  # failure on the pull request the run tried to merge.
  notify-failure:
    needs: [propose]
    if: needs.propose.outputs.merge-reason == 'ci-failure' || needs.propose.outputs.merge-reason == 'merge-refused'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Open or update the failure issue
        uses: ./.github/actions/notify-failure
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          message: ${{ (needs.propose.outputs.merge-reason == 'merge-refused' && 'GitHub refused the automatic merge, so the pull request is waiting for you. Approve its pending ci run if one is waiting, then merge it; see the Auto-merge section of docs/ci.md.') || 'The scheduled run failed.' }}
