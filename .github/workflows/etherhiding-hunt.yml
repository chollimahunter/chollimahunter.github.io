name: EtherHiding hunt

# Looks for EtherHiding contracts the watchlist does not carry yet, with
# scripts/hunt-etherhiding.js: each watchlisted contract's write history is
# rebuilt from the string arguments of the transactions sent to it, the wallets
# that wrote are followed to the other contracts they deployed or wrote to, and
# the recent block window is swept for contracts emitting a known rotation
# event. Nothing is filed: the report goes to the job summary (defanged) and an
# artifact, for a person to review. The write history of watchlisted contracts
# (src/_data/etherhidingFindings/writes.json, the Write transactions table on
# each contract's indicator page) is committed through a pull request that
# merges itself once ci is green, like the refresh. A seeded run does not
# commit it. Ethereum through keyless Blockscout; Polygon through
# Etherscan's V2 API with the ETHERSCAN_API_KEY secret. BNB Smart Chain through
# NodeReal with the NODEREAL_API_KEY secret.

on:
  schedule:
    - cron: "40 7 1 * *" # monthly, the 1st at 07:40 UTC (weekly cost about 870 runner minutes a month)
  workflow_dispatch:
    inputs:
      seed:
        description: "Optional chain:address to hunt from instead of the watchlist (e.g. polygon:0x...)"
        required: false

permissions:
  contents: read

env:
  AUTO_MERGE: "true"

concurrency:
  group: etherhiding-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # About a week of blocks per chain for the sweep: Polygon makes a block
      # about every two seconds, Ethereum every twelve.
      - name: Hunt
        shell: bash
        env:
          SEED: ${{ inputs.seed }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          NODEREAL_API_KEY: ${{ secrets.NODEREAL_API_KEY }}
        run: |
          # Polygon's Blockscout refuses requests from CI runners (403 on both
          # its /api and /api/v2), so Polygon is read through Etherscan's V2
          # API when the ETHERSCAN_API_KEY secret is set, and skipped otherwise.
          # The budget stops the hunt well inside the job's timeout, so the
          # report, the artifact and the write histories are kept; the first
          # full run had none and was killed at four hours with nothing written.
          # Routescan backs Blockscout on Ethereum: alone, a throttled Blockscout
          # left the event sweep without a head block (2026-10-18).
          args=(--indexer ethereum=https://eth.blockscout.com/api --indexer ethereum=https://api.routescan.io/v2/network/mainnet/evm/1/etherscan/api --indexer sepolia=https://eth-sepolia.blockscout.com/api --out hunt/latest.json --writes src/_data/etherhidingFindings/writes.json --budget 200)
          if [ -n "$ETHERSCAN_API_KEY" ]; then
            args+=(--indexer "polygon=https://api.etherscan.io/v2/api?chainid=137")
            args+=(--indexer "ethereum=https://api.etherscan.io/v2/api?chainid=1")
            args+=(--indexer "sepolia=https://api.etherscan.io/v2/api?chainid=11155111")
          else
            echo "::warning::ETHERSCAN_API_KEY is not set; Polygon is not hunted."
          fi
          if [ -n "$NODEREAL_API_KEY" ]; then
            args+=(--indexer bsc=nodereal)
          else
            echo "::warning::NODEREAL_API_KEY is not set; BNB Smart Chain is not hunted."
          fi
          if [ -n "$SEED" ]; then
            args+=(--seed "$SEED")
          else
            args+=(--sweep 300000)
          fi
          node scripts/hunt-etherhiding.js "${args[@]}"

      - name: Summary
        if: always()
        run: |
          [ -f hunt/latest.md ] && cat hunt/latest.md >> "$GITHUB_STEP_SUMMARY" || echo "No report written." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etherhiding-hunt
          path: hunt/
          if-no-files-found: ignore

      - name: Open or update pull request
        id: cpr
        if: inputs.seed == ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: EtherHiding write histories"
          title: "EtherHiding write histories"
          body: "Weekly re-read of every watchlisted contract's write transactions by scripts/hunt-etherhiding.js, shown in the Write transactions table on each contract's indicator page. Candidates are in the run's job summary, not here."
          branch: etherhiding/writes
          add-paths: |
            src/_data/etherhidingFindings/writes.json
          labels: automated,data-sync

      # Pull requests opened with GITHUB_TOKEN trigger no pull_request runs, so
      # ci is dispatched on the branch.
      - name: Validate the pull request branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Return to the base commit
        if: env.AUTO_MERGE == 'true' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        run: git checkout --quiet "$GITHUB_SHA"

      - name: Merge when ci is green
        if: env.AUTO_MERGE == 'true' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        uses: ./.github/actions/merge-when-green
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          branch: ${{ steps.cpr.outputs.pull-request-branch }}
          expected-branch: etherhiding/writes
