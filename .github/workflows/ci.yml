name: Validate pull request

# Runs the same checks as the deploy workflow (validate, build, check, unit
# tests) against a pull request, without deploying anything. The job is named
# ci because the ruleset on main requires a passing check of that name. Pull
# requests opened by a workflow with GITHUB_TOKEN do not trigger pull_request
# runs, so each workflow that opens one dispatches this workflow on the pull
# request's branch instead. See docs/ci.md.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Build site
        run: npm run build

      - name: Check built site
        run: npm run check

      - name: Check stylesheet
        run: npm run check:css

      - name: Run unit tests
        run: npm run test:unit

      # Structural consistency of the indicator data and the built payload;
      # fails on any finding. See scripts/audit-integrity.js.
      - name: Audit data integrity
        run: npm run audit:integrity
